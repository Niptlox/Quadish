# Собирает игру под Linux и Windows и публикует GitHub Release.
# Триггер: пуш тега вида v* (например, git tag v0.2.2-alpha && git push --tags).
# Windows-exe собирается на windows-раннере (PyInstaller не кросс-компилирует).

name: Release build

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег для релиза (например, v0.2.2-alpha)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy pygame pyinstaller
          # noise — C-расширение; если не соберётся, игра использует
          # встроенный python-фолбэк (units/noise_compat.py)
          pip install noise || echo "noise не собрался — будет встроенный шум"
      - name: Build with PyInstaller
        run: pyinstaller Quadish.spec --noconfirm
      - name: Smoke test
        shell: bash
        run: python game.py test
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf Quadish-${{ github.ref_name }}-linux-x64.tar.gz -C dist Quadish
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Quadish/* -DestinationPath Quadish-${{ github.ref_name }}-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quadish-${{ runner.os }}
          path: |
            Quadish-*-linux-x64.tar.gz
            Quadish-*-windows-x64.zip
          if-no-files-found: ignore

  release:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      # ВАЖНО: checkout должен идти до download-artifact — checkout по
      # умолчанию чистит (clean: true) содержимое рабочей директории, и
      # если он выполняется после скачивания артефактов, он же их и стирает
      # (файлы-архивы удалялись прямо перед шагом создания релиза).
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          sparse-checkout: |
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.tar.gz artifacts/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Нет собранных артефактов — релиз не создаётся"
            exit 1
          fi
          # SHA256-чексуммы для проверки целостности (файл прикладываем к релизу)
          ( cd artifacts && sha256sum *.tar.gz *.zip 2>/dev/null > SHA256SUMS.txt || true )
          SUMS=$(cat artifacts/SHA256SUMS.txt 2>/dev/null || true)
          files+=(artifacts/SHA256SUMS.txt)
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${{ github.repository }}"
          # Секция этого тега из CHANGELOG.md (между "## [TAG]" и следующим "## [")
          CHANGELOG_SECTION=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_SECTION=$(awk -v tag="## [$TAG]" '
              index($0, "## [") == 1 && index($0, tag) == 1 { found=1; next }
              index($0, "## [") == 1 && found { exit }
              found { print }
            ' CHANGELOG.md)
          fi
          CHANGELOG_BLOCK=""
          if [ -n "$CHANGELOG_SECTION" ]; then
            CHANGELOG_BLOCK="## Что изменилось
          $CHANGELOG_SECTION

          "
          fi
          NOTES="${CHANGELOG_BLOCK}Автоматическая сборка Quadish. Python не требуется, собрано на Python 3.13.

          **Скачать и запустить:**
          - **Windows** — \`Quadish-*-windows-x64.zip\`: распакуйте и запустите \`Quadish.exe\`
          - **Linux** — \`Quadish-*-linux-x64.tar.gz\`: распакуйте и запустите \`./Quadish\`

          **⚠️ Браузер/Windows предупреждают о файле?** Это ожидаемо: exe не
          подписан платным сертификатом, а у новой сборки нулевая репутация —
          это не вирус.
          - **Chrome/Edge:** у загрузки нажмите «⋯» → **«Сохранить» / «Keep»**
            (или в \`chrome://downloads\` → «Сохранить опасный файл»).
          - **Windows SmartScreen** при запуске: **«Подробнее» → «Выполнить в
            любом случае»**.
          - Для спокойствия сверьте SHA256 из \`SHA256SUMS.txt\` (см. ниже).

          Самопроверка сборки: \`Quadish test\`.

          \`\`\`
          $SUMS
          \`\`\`"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # релиз уже есть (повторный запуск тега) — обновляем архивы и описание
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "${files[@]}" --repo "$REPO" \
              --title "Quadish $TAG" --prerelease --notes "$NOTES"
          fi
